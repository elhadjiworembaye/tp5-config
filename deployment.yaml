apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp5-app
  labels:
    app: tp5-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tp5-app
  template:
    metadata:
      labels:
        app: tp5-app
    spec:
      containers:
        - name: tp5-app
          image: wore1998/tp5-app:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
